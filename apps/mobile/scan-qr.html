<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechDesk Pro — Expo Go QR</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin: 0.25rem 0 1.5rem; text-align: center; max-width: 360px; }
    img {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      width: 280px;
      height: 280px;
    }
    code {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-top: 1.5rem;
    }
  </style>

<body>
  <h1>TechDesk Pro</h1>
  <p>Scan with <strong>Expo Go</strong>. Phone and PC must be on the same Wi‑Fi.</p>
  <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=exp://oukmk_u-anonymous-8081.exp.direct"
    alt="Expo Go QR Code"
  />
  <code>exp://oukmk_u-anonymous-8081.exp.direct</code>

</html>
